# ============================================================
# Company Multi-Site Network — Provisioning Inventory
# ============================================================
# This file defines the target network state.
# The automation pipeline reads this and generates/deploys
# the appropriate configurations.
#
# Connection parameters (host/user/password) are resolved
# from config/devices.yaml via the 'device' key on each action.
#
# Action types:
#   - add_branch     : Full new branch (router + switch + VLAN + OSPF + PC)
#   - add_subdept    : New VLAN/subinterface on an existing branch router
#   - add_endpoint   : New PC on an existing switch access port
# ============================================================

# --- Existing infrastructure (reference only) ---
existing_infrastructure:
  - site_name: "Maroc-Phosphore1"
    router_ip: "10.0.10.2"
    switch_ip: "192.168.100.2"
    department_vlan: 100
    subnet: "192.168.100.0/24"
    gateway: "192.168.100.1"

  - site_name: "Maroc-Phosphore2"
    router_ip: "10.0.20.2"
    switch_ip: "192.168.200.2"
    department_vlan: 200
    subnet: "192.168.200.0/24"
    gateway: "192.168.200.1"

# --- Actions to execute ---
provisioning:
  - action: "add_branch"
    site_name: "Maroc-Chimie"
    device: "Cat8000-Sandbox"

    # Router WAN (to HQ-Switch via backbone VLAN 30)
    router_wan_port: "GigabitEthernet0/0/0"
    router_wan_ip: "10.0.30.2"
    router_wan_mask: "255.255.255.252"
    router_wan_gateway: "10.0.30.1"

    # Router trunk port to access switch
    router_trunk_port: "GigabitEthernet0/0/1"

    # Department VLAN (on router subinterface)
    # NOTE: subnets must be valid IPv4 (192.168.300.0/24 was a Packet Tracer
    # fiction — real IOS rejects octets above 255)
    department_vlan: 30
    vlan_name: "CHIMIE"
    department_subnet: "192.168.30.0/24"
    department_network: "192.168.30.0"
    department_wildcard: "0.0.0.255"
    gateway: "192.168.30.1"

    # Switch config
    switch_vlan: 30
    switch_mgmt_ip: "192.168.30.2"
    switch_mgmt_mask: "255.255.255.0"
    switch_default_gateway: "192.168.30.1"
    switch_trunk_port: "FastEthernet0/1"
    switch_access_port: "FastEthernet0/2"

    # PC endpoint
    pc_ip: "192.168.30.10"
    pc_mask: "255.255.255.0"
    pc_gateway: "192.168.30.1"

    # OSPF
    ospf_process: 1
    ospf_area: 0
    ospf_router_id: "10.0.30.2"

  # Uncomment below to add a sub-department to Phos1
  # - action: "add_subdept"
  #   site_name: "Maroc-Phosphore1"
  #   device: "Cat8000-Sandbox"
  #   target_router_ip: "10.0.10.2"
  #   trunk_port: "GigabitEthernet0/0/1"
  #   vlan_id: 110
  #   vlan_name: "MAINTENANCE"
  #   subnet: "192.168.110.0/24"
  #   gateway: "192.168.110.1"
  #   ospf_process: 1
  #   ospf_area: 0

  # Uncomment below to add an endpoint to Chimie after branch is deployed
  # - action: "add_endpoint"
  #   site_name: "Maroc-Chimie"
  #   device: "Cat8000-Sandbox"
  #   target_switch_ip: "192.168.300.2"
  #   vlan_id: 300
  #   port: "FastEthernet0/3"
  #   pc_ip: "192.168.300.20"
  #   pc_mask: "255.255.255.0"
  #   pc_gateway: "192.168.300.1"
